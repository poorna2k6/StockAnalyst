<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>
  <!-- Candlestick bar 1 (left) -->
  <rect x="72" y="295" width="76" height="158" rx="12" fill="white" opacity="0.72"/>
  <line x1="110" y1="232" x2="110" y2="295" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.72"/>
  <!-- Candlestick bar 2 (center) -->
  <rect x="206" y="188" width="76" height="188" rx="12" fill="white" opacity="0.88"/>
  <line x1="244" y1="122" x2="244" y2="188" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.88"/>
  <!-- Candlestick bar 3 (right, tallest) -->
  <rect x="340" y="88" width="76" height="224" rx="12" fill="white"/>
  <line x1="378" y1="45" x2="378" y2="88" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <!-- Gold rising trend line -->
  <polyline points="110,260 244,152 378,72" stroke="#FCD34D" stroke-width="24" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gold dot anchors -->
  <circle cx="110" cy="260" r="16" fill="#FCD34D"/>
  <circle cx="244" cy="152" r="16" fill="#FCD34D"/>
  <circle cx="378" cy="72" r="22" fill="#FCD34D"/>
</svg>
